<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1116">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tippyo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tippyo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234e7f9c'/%3E%3Cpath d='M32 12l6.2 13 14.3 1.9-10.5 9.9 2.7 14.2L32 43.8 19.3 51l2.7-14.2L11.5 26.9 25.8 25z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Identidad oscura, como la demo. Mismo azul y dorado. */
:root{
  --ink:#080b0e; --surface:#11171c; --surface2:#182028; --surface3:#202a34; --line:#25303a;
  --brand:#4e7f9c; --brand-b:#7cbbdf; --gold:#f2c14e; --gold-d:#d9a02a;
  --text:#eef3f6; --text2:#b6c3cd; --muted:#8697a4; --faint:#5d6d79;
  --good:#2fbf5b; --warn:#fab219; --crit:#e5584f;
  --d:"Archivo","Helvetica Neue",Arial,sans-serif; --b:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; --m:"IBM Plex Mono",Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0;min-height:100dvh;background:var(--ink);color:var(--text);font-family:var(--b);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
/* luz de fondo que respira, solo decorativa */
body::before{content:"";position:fixed;inset:0 0 auto 0;height:50dvh;z-index:-1;pointer-events:none;background:radial-gradient(60% 70% at 50% 0%,rgba(78,127,156,.20),transparent 75%)}
h1,h2,h3{font-family:var(--d);margin:0;text-wrap:balance}
a{color:var(--brand-b)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--brand-b);outline-offset:2px;border-radius:8px}

/* marco */
.top{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(8,11,14,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05)}
.marca{display:flex;align-items:center;gap:9px;font-family:var(--d);font-weight:800;letter-spacing:.16em;color:#fff;text-decoration:none;font-size:14px}
.marca i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(140deg,var(--brand-b),var(--brand));color:#fff;font-style:normal;font-size:14px}
.quien{display:flex;gap:8px;align-items:center;min-width:0}
.quien span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.icbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--text2);transition:transform .14s var(--ease)}
.icbtn:active{transform:scale(.93)}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px calc(64px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.enter>*:not(#flash){animation:sube .34s var(--ease) both}
.enter>*:nth-child(3){animation-delay:40ms}.enter>*:nth-child(4){animation-delay:80ms}.enter>*:nth-child(5){animation-delay:120ms}
.enter>*:nth-child(6){animation-delay:160ms}.enter>*:nth-child(7){animation-delay:200ms}.enter>*:nth-child(n+8){animation-delay:240ms}
@keyframes sube{from{opacity:0;transform:translateY(12px)}}
.ic{flex:0 0 auto}

/* texto */
.big{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.12}
.big.m{font-size:26px}
.lead{color:var(--text2);margin:6px 0 0}
.muted{color:var(--muted)}.tiny{font-size:12.5px}.mono{font-family:var(--m)}
.k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}

/* tarjetas y fichas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:block;text-decoration:none;color:inherit}
.card.ok{border-color:rgba(47,191,91,.45)}.card.warn{border-color:rgba(250,178,25,.45)}
.sec{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec .bub{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(124,187,223,.12);color:var(--brand-b)}
.sec h2{flex:1}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;
  transition:transform .16s var(--ease),border-color .16s}
.tile:active{transform:scale(.975)}
.tile .bub{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
.tile b{font-family:var(--d);font-size:19px;letter-spacing:-.01em;display:block}
.tile span.s{color:var(--muted);font-size:14px}
.tile .go{margin-left:auto;color:var(--faint);transition:transform .2s var(--ease)}
.b1,.b2,.b3{background:rgba(124,187,223,.12);color:var(--brand-b)!important;border:1px solid rgba(124,187,223,.22)}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:6px}
.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#fff;background:linear-gradient(140deg,var(--brand-b),var(--brand))}
.logo span{display:block}

/* botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 18px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;text-decoration:none;
  transition:transform .14s var(--ease),opacity .2s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--brand-b);color:#06121a}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text2)}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn.crit{background:transparent;border:1px solid rgba(229,88,79,.55);color:#ee8a82}
.btn[disabled]{opacity:.4;pointer-events:none;filter:saturate(.4)}
@media (hover:hover) and (pointer:fine){.tile:hover{border-color:var(--brand)}.tile:hover .go{transform:translateX(4px)}.btn:hover{filter:brightness(1.08)}}

.row{display:flex;flex-direction:row;align-items:center;gap:12px}
.col{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;position:relative}
.seg button{min-height:42px;border-radius:10px;color:var(--muted);font-weight:600;transition:color .2s,background .2s}
.seg button.on{background:var(--surface3);color:#fff}

/* avatares */
.ava{width:48px;height:48px;border-radius:14px;flex:0 0 auto;object-fit:cover;display:grid;place-items:center;font-family:var(--d);font-weight:800;color:#fff;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px transparent;transition:box-shadow .25s}
.ava.xl{width:92px;height:92px;border-radius:26px;font-size:32px}
.ava.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--good)}

/* estrellas, caras */
.st i{font-style:normal;color:var(--surface3)}.st i.on{color:var(--gold)}
.estrellas{display:flex;justify-content:center;gap:4px}
.estrellas button{font-size:46px;line-height:1;padding:2px 3px;color:var(--surface3);transition:color .14s,transform .14s var(--ease)}
.estrellas button.on{color:var(--gold)}
.estrellas button:active{transform:scale(.88)}
.estrellas button.pop{animation:pop .2s var(--ease)}
@keyframes pop{40%{transform:scale(1.12)}}
.cara-t{text-align:center;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:transparent;transition:transform .14s var(--ease),background .2s,color .2s,border-color .2s}
button.chip:active{transform:scale(.94)}
.chip.on{background:rgba(124,187,223,.14);border-color:rgba(124,187,223,.6);color:var(--brand-b)}
.chip.good{color:#6fe08f;border-color:rgba(47,191,91,.5)}.chip.warn{color:var(--warn);border-color:rgba(250,178,25,.5)}

/* formularios */
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.campo input,.campo select,.campo textarea{width:100%;min-height:52px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:0;border-color:var(--brand-b);box-shadow:0 0 0 4px rgba(124,187,223,.14)}
.campo textarea{resize:none;min-height:70px}
form{display:flex;flex-direction:column;gap:14px}
input[type=file]{padding:8px!important;color:var(--muted);font-size:14px}
input[type=file]::file-selector-button{border:0;border-radius:10px;background:var(--surface3);color:var(--text);padding:9px 14px;margin-right:12px;font:inherit;font-weight:600;cursor:pointer}

/* aviso flotante */
#flash:empty{display:none}
#flash{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;padding:0 16px;pointer-events:none}
.flash{max-width:448px;margin:0 auto;padding:13px 16px;border-radius:16px;font-size:14.5px;font-weight:500;display:flex;gap:10px;align-items:center;
  background:rgba(24,32,40,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 40px -10px rgba(0,0,0,.7);animation:sube .3s var(--ease) both}
.flash.ok{border:1px solid rgba(47,191,91,.55)}.flash.err{border:1px solid rgba(229,88,79,.6)}

/* códigos, interruptores */
.codigo{font-family:var(--m);font-size:24px;font-weight:600;letter-spacing:.18em;color:var(--brand-b)}
.cod{width:100%;text-align:center;padding:14px;border-radius:16px;border:1.5px dashed rgba(124,187,223,.55);background:rgba(124,187,223,.05);transition:transform .14s var(--ease),background .2s}
.cod:active{transform:scale(.98)}
.cod.nuevo{animation:nuevo 1.1s var(--ease) both}
@keyframes nuevo{0%{transform:translateY(6px);opacity:0}40%{background:rgba(124,187,223,.2)}100%{transform:none;opacity:1}}
.sw{width:54px;height:32px;border-radius:99px;background:var(--surface3);border:1px solid var(--line);position:relative;flex:0 0 auto;transition:background .2s,border-color .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:var(--muted);transition:transform .22s var(--ease),background .2s}
.sw.on{background:rgba(47,191,91,.28);border-color:var(--good)}.sw.on i{transform:translateX(22px);background:var(--good)}
.lista{display:flex;flex-direction:column}
.lista>*{padding:13px 0;border-bottom:1px solid var(--line)}.lista>*:last-child{border-bottom:0;padding-bottom:2px}
.lista>*:first-child{padding-top:2px}
button.fila{width:100%;text-align:left;display:flex;align-items:center;gap:12px}

/* cliente: elegir persona */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:18px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:transform .16s var(--ease),border-color .2s}
.pick:active{transform:scale(.96)}
.pick b{font-family:var(--d);font-size:17px;line-height:1.15}
@media (hover:hover) and (pointer:fine){.pick:hover{border-color:var(--brand)}}
.vol{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;padding:6px 10px 6px 4px;border-radius:10px}
.centro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}

/* gracias */
.gracias{position:relative;overflow:hidden;text-align:center;padding:34px 18px;min-height:46dvh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.gracias .btn{width:auto;padding:0 22px}
.gracias .card{text-align:center;display:flex;flex-direction:column;align-items:center}
.tick{width:84px;height:84px;margin:0 auto 10px}
.tick circle{fill:rgba(47,191,91,.14);stroke:var(--good);stroke-width:3;stroke-dasharray:252;stroke-dashoffset:252;animation:trazo .55s var(--ease) .05s forwards}
.tick path{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:trazo .4s var(--ease) .45s forwards}
@keyframes trazo{to{stroke-dashoffset:0}}

/* jefe y trabajador */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--d);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.ring{position:relative;width:78px;height:78px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .f{stroke:var(--gold);stroke-dasharray:var(--c);animation:anillo .9s var(--ease) .12s both}
@keyframes anillo{from{stroke-dashoffset:var(--c)}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--d);font-size:21px;font-weight:800}
.perfil{background:linear-gradient(160deg,rgba(78,127,156,.35),var(--surface) 60%);border:1px solid var(--line);border-radius:24px;padding:18px}
.lista>.linea{border-bottom:0;padding:2px 0 20px 22px}.lista>.linea:last-child{padding-bottom:2px}
.linea{position:relative}
.linea::before{content:"";position:absolute;left:5px;top:10px;bottom:-6px;width:2px;background:var(--line)}
.linea:last-child::before{display:none}
.linea::after{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:99px;background:var(--surface3);border:2px solid var(--brand)}
.linea.act::after{background:var(--good);border-color:var(--good);box-shadow:0 0 0 5px rgba(47,191,91,.18)}
.vacio{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;color:var(--muted);text-align:center}
.vacio .ic{color:var(--faint)}
.qrbox{background:#fff;color:#0d1418;border-radius:18px;padding:20px;text-align:center}
.qrbox canvas{max-width:100%;height:auto;margin:10px auto 0;display:block}
.qrbox .n{font-family:var(--d);font-weight:800;font-size:19px}
.rep{font-size:11px;color:var(--faint);text-decoration:underline;padding:0 4px}
.doc h2{margin:14px 0 4px}.doc p,.doc li{color:var(--text2);font-size:15px;margin:0 0 6px}.doc ul{padding-left:18px;margin:0}
.linea-firma{border-bottom:1px solid var(--faint);height:30px;margin:6px 0 2px}
.pie{display:flex;gap:16px;justify-content:center;font-size:12.5px}.pie a{color:var(--muted)}.pie span{color:var(--faint)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;background:rgba(8,11,14,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs-in{display:flex;width:100%;max-width:480px}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;transition:color .15s,transform .14s var(--ease)}
.tabs a.on{color:var(--brand-b)}.tabs a:active{transform:scale(.94)}
body.has-tabs .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.has-tabs .vista{bottom:calc(68px + env(safe-area-inset-bottom))}
body.has-tabs #flash{bottom:calc(86px + env(safe-area-inset-bottom))}
.prog{height:6px;border-radius:99px;background:var(--surface3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-b));transform:scaleX(var(--p));transform-origin:left}
.enter .prog i{animation:llena .7s var(--ease) .1s both}
@keyframes llena{from{transform:scaleX(0)}}
.cupon{border:1.5px dashed rgba(124,187,223,.55);border-radius:14px;padding:12px;text-align:center}
.cupon.usado{opacity:.5;border-style:solid;border-color:var(--line)}
.hoja{display:none}
.barras{display:flex;gap:8px;align-items:flex-end;height:104px;margin-top:8px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;height:calc(var(--h)*56px + 4px);border-radius:6px;background:linear-gradient(var(--brand-b),var(--brand));transform-origin:bottom}
.bar.cero i{background:var(--surface3)}.bar b{font:700 12px var(--d);color:var(--text);min-height:14px}.bar em{font-style:normal;letter-spacing:.08em}
.enter .bar i{animation:crece .6s var(--ease) both}.enter .bar:nth-child(2) i{animation-delay:40ms}.enter .bar:nth-child(3) i{animation-delay:80ms}.enter .bar:nth-child(4) i{animation-delay:120ms}.enter .bar:nth-child(5) i{animation-delay:160ms}.enter .bar:nth-child(6) i{animation-delay:200ms}.enter .bar:nth-child(7) i{animation-delay:240ms}
@keyframes crece{from{transform:scaleY(0)}}
.vista{position:fixed;left:6px;bottom:calc(4px + env(safe-area-inset-bottom));z-index:30;font-size:9px;letter-spacing:.08em;font-weight:600;padding:2px 7px;opacity:.8;border-radius:99px;background:rgba(250,178,25,.18);color:var(--warn);border:1px solid rgba(250,178,25,.4);pointer-events:none;white-space:nowrap}

/* cargando */
.sk{height:84px;border-radius:18px;background:linear-gradient(100deg,var(--surface) 30%,var(--surface3) 50%,var(--surface) 70%);background-size:300% 100%;opacity:0;animation:aparece .2s .25s forwards,brillo 1.3s linear infinite}
@keyframes aparece{to{opacity:1}}@keyframes brillo{to{background-position:-300% 0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{
  body,html{background:#fff} body::before{display:none} .top,#flash,.vista,.wrap>*:not(.qrprint):not(.imprimible):not(.hoja){display:none!important}
  .wrap{padding:0;max-width:none} .qrprint,.imprimible{display:block!important;border:0!important}
  .tabs{display:none!important}
  .hoja{display:none}
  body.todas .wrap>*:not(.hoja){display:none!important}
  body.todas .hoja{display:grid!important;grid-template-columns:1fr 1fr;gap:8mm}
  .pegatina{break-inside:avoid;border:1px dashed #999;padding:8mm 6mm;text-align:center;color:#000;background:#fff}
  .pegatina .n{font:800 15pt Archivo,Arial,sans-serif}.pegatina .t{font:10pt Arial,sans-serif;color:#444}.pegatina .m{font:600 13pt 'IBM Plex Mono',monospace;margin-top:2mm}
  .pegatina canvas{width:58mm;height:58mm;margin:3mm auto 0;display:block;image-rendering:pixelated}
  .imprimible,.imprimible *{color:#111!important;background:transparent!important;border-color:#bbb!important;box-shadow:none!important;animation:none!important}
  .imprimible .st i{color:#ccc!important}.imprimible .st i.on{color:#d9a02a!important}.imprimible .ring .f{stroke:#d9a02a!important}.imprimible .ring circle:first-child{stroke:#ddd!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="preview.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
/* ============================================================
   Tippyo · app real (piloto). Una sola página, rutas con #.
   Lo que vale la clave de abajo: es la "publishable", pensada para ir en el navegador.
   La seguridad real está en las políticas de la base de datos (supabase/schema.sql).

function comprimir(file,lado=256){return new Promise((ok,ko)=>{
  const fr=new FileReader();fr.onerror=()=>ko(new Error('No se ha podido leer la imagen.'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>ko(new Error('Esa imagen no es válida.'));
    im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=lado;const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,lado,lado);
      c.toBlob(b=>b?ok(b):ko(new Error('No se ha podido preparar la imagen.')),'image/jpeg',.82)};
    im.src=fr.result};
  fr.readAsDataURL(file)})}
async function subirFoto(file){
  const blob=await comprimir(file);
  const ruta=`${S.user.id}/${Date.now()}.jpg`;
  const {error}=await sb.storage.from('photos').upload(ruta,blob,{contentType:'image/jpeg'});
  if(error)throw error;
  const {data}=sb.storage.from('photos').getPublicUrl(ruta);
  const {error:e2}=await sb.from('profiles').update({photo_pending_url:data.publicUrl}).eq('id',S.user.id);
  if(e2)throw e2;
}

function cuenta(nueva){

  document.querySelectorAll('[data-count]').forEach(el=>{
    const v=+el.dataset.count,dec=+el.dataset.dec||0,t0=performance.now(),L=v.toLocaleString('es-ES',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    const paso=t=>{const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);
      el.textContent=p<1?(v*e).toLocaleString('es-ES',{minimumFractionDigits:dec,maximumFractionDigits:dec}):L;if(p<1)requestAnimationFrame(paso)};
    requestAnimationFrame(paso)})}

async function vCliente(cid,mesa,tok){
  if(!UUID.test(cid||'')||!/^\d{1,3}$/.test(mesa||'')||!tok)return tarjeta('Enlace incompleto','Escanea otra vez la pegatina de tu mesa.');

  const clave=[cid,mesa,tok].join('|');
  if(!S.mesaCache||S.mesaCache.clave!==clave){
    const [c,e,pr]=await Promise.all([
      sb.from('companies').select('name,city').eq('id',cid).maybeSingle(),
      sb.rpc('who_is_on_shift',{p_company:cid,p_table:+mesa,p_token:tok}),
      sb.rpc('perks',{p_company:cid})]);
    if(c.error)throw c.error;if(e.error)throw e.error;
    const pk=pr.data||{};S.mesaCache={clave,co:c.data,eq:e.data||[],perks:pk,premios:!!(pk.local||pk.tippyo)};
  }
  const {co,eq}=S.mesaCache,pop=S.anim;
  if(!co||!eq.length)return tarjeta('No podemos abrir esta mesa','El QR no es de este local o ahora mismo no hay nadie en turno. Pregunta en barra.');
  const cab=`<div><div class="k">${esc(co.city)} · mesa ${esc(mesa)}</div><h1 class="big m">${esc(co.name)}</h1></div>`;
  const pk=S.mesaCache.perks||{},ganado=[S.form.tp>0?`+${S.form.tp} punto Tippyo`:'',S.form.pts>0?`+${S.form.pts} punto en ${esc(co.name)}`:''].filter(Boolean).join(' · ');
  const oferta=[pk.tippyo?'puntos Tippyo para canjear por descuentos de marcas':'',pk.local?'premios de este local':''].filter(Boolean).join(' y ');
  const premioMsg=!S.mesaCache.premios?'':S.user
    ?(ganado?`<div class="card" style="margin-top:16px;width:100%"><b>${ganado}</b><div class="tiny muted" style="margin:2px 0 10px">Se acumulan en tu cuenta.</div><a class="btn sm" href="#/tarjeta">Ver mi tarjeta</a></div>`:'<p class="tiny muted" style="margin:14px 0 0">Hoy ya has sumado puntos por esta persona.</p>')

  const nota=S.form.nota||0,com=S.form.com||'';

    ${pend?`<div class="tiny muted" style="margin-top:8px;display:flex;gap:6px;align-items:center">${ico('clock',14)}${pend} pendiente${pend===1?'':'s'}: se activan a los 3 días</div>`:''}
    ${cat.data.length?`<div class="lista" style="margin-top:10px">${cat.data.map(r=>`<div class="row"><div class="col"><div class="tiny muted">${esc(r.brand)}</div><b>${esc(r.name)}</b><div class="tiny muted">${r.cost} puntos</div></div><button class="btn sm ${disp>=r.cost?'':'ghost'}" data-act="canjear-tippyo" data-id="${esc(r.id)}" ${disp>=r.cost?'':'disabled'}>Canjear</button></div>`).join('')}</div>`
      :'<p class="tiny muted" style="margin:10px 0 0">Muy pronto: descuentos de marcas aliadas.</p>'}</div>`;
  const locales=pt.data.length?pt.data.map(c=>{
    const prem=rw.data.filter(r=>r.company_id===c.company_id),sig=prem.find(r=>r.cost>c.points);
    return `<div class="card"><div class="row"><div class="col"><div class="k">Puntos del local</div><h2>${esc(c.company_name)}</h2><div class="tiny muted">${esc(c.city)}</div></div><div style="text-align:right"><b style="font:700 28px var(--d)">${c.points}</b><div class="tiny muted">puntos</div></div></div>
      ${sig?`<div class="prog" style="margin-top:12px;--p:${Math.min(1,c.points/sig.cost).toFixed(3)}"><i></i></div><div class="tiny muted" style="margin-top:6px">Te faltan ${sig.cost-c.points} para «${esc(sig.name)}»</div>`:''}
      ${prem.length?`<div class="lista" style="margin-top:10px">${prem.map(r=>`<div class="row"><div class="col"><b>${esc(r.name)}</b><div class="tiny muted">${r.cost} puntos</div></div><button class="btn sm ${c.points>=r.cost?'':'ghost'}" data-act="canjear" data-id="${esc(r.id)}" ${c.points>=r.cost?'':'disabled'}>Canjear</button></div>`).join('')}</div>`:'<p class="tiny muted" style="margin:10px 0 0">Este local no tiene premios activos ahora mismo.</p>'}</div>`}).join(''):'';
  const cupT=tc.data.map(x=>`<div class="cupon"><div class="tiny muted">${esc(x.brand)}</div><b>${esc(x.name)}</b><div class="codigo" style="font-size:20px;margin:4px 0">${esc(x.code)}</div><div class="tiny muted">Úsalo en la marca aliada</div></div>`);
  const cupL=cp.data.slice(0,10).map(x=>`<div class="cupon ${x.used_at?'usado':''}"><div class="tiny muted">Local</div><b>${esc(x.reward_name)}</b><div class="codigo" style="font-size:20px;margin:4px 0">${esc(x.code)}</div><div class="tiny muted">${x.used_at?'Entregado':'Enséñalo en el local'}</div></div>`);
  return `<div><div class="k">Cliente</div><h1 class="big m">Mi tarjeta</h1></div>${tippyo}${locales}
  ${cupT.length+cupL.length?`<div class="card">${sec('key','Mis cupones')}<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">${cupT.concat(cupL).join('')}</div></div>`:''}
  <button class="btn ghost" data-act="salir">${ico('out',18)}Cerrar sesión</button>
  ${borrar('Se borran tu cuenta, tus puntos y tus cupones. No se puede deshacer.')}${pie()}`;
}

/* ---------- acciones (botones) ---------- */
const acts={
  async salir(){await sb.auth.signOut();S.user=null;S.co=null;location.hash='#/';render()},
  modo(b){S.form.modo=b.dataset.m;render()},
  'cuenta-cliente'(){S.form={modo:'alta'};localStorage.setItem('tippyo_rol','cliente');location.hash='#/entrar/cliente'},
  elegir(b){S.form.sel=b.dataset.id;S.form.nota=0;S.form.com='';render()},
  nota(b){S.form.nota=+b.dataset.v;S.anim=true;render()},
  chip(b){
    const v=b.dataset.v,c=S.form.com||'';
    S.form.com=c.includes(v)?c.replace(new RegExp('(, )?'+v),'').replace(/^, /,''):(c?c+', '+v:v).slice(0,120);
    render()},
  otra(){S.form={};render()},
  async enviar(){
    const r=ruta();
    const {data,error}=await sb.rpc('submit_rating',{p_stint:S.form.sel,p_table:+r[2],p_token:r[3],p_stars:S.form.nota,p_comment:S.form.com||'',p_device:dispositivo()});
    if(error)throw error;
    const d=data&&typeof data==='object'?data:{};S.form={hecho:true,pts:+d.local||0,tp:+d.tippyo||0};render();
  },
  async turno(b){
    const id=b.dataset.id,on=b.dataset.on==='1';
    b.classList.toggle('on',!on);b.setAttribute('aria-pressed',String(!on)); /* responde al instante */
    const {error}=await(on?sb.from('shifts').delete().eq('stint_id',id).eq('day',hoy()):sb.from('shifts').insert({stint_id:id}));
    if(error){render();throw error}
    setTimeout(render,260);
  },
  baja(b){S.form.baja=b.dataset.id;render()},
  'baja-no'(){S.form.baja=null;render()},
  async 'baja-ok'(b){
    const {error}=await sb.rpc('end_stint',{p_stint:b.dataset.id});if(error)throw error;
    S.form.baja=null;flash('Baja hecha. Su historial se va con la persona.');render();
  },
  async 'foto-ok'(b){const {error}=await sb.rpc('approve_photo',{p_worker:b.dataset.id});if(error)throw error;flash('Foto aprobada.');render()},
  async 'foto-no'(b){const {error}=await sb.rpc('reject_photo',{p_worker:b.dataset.id});if(error)throw error;flash('Foto descartada.');render()},
  async 'gen-codigo'(){
    const pre=(S.co.name.normalize('NFD').replace(/[^A-Za-z]/g,'').slice(0,2)||'TP').toUpperCase();
    for(let i=0;i<5;i++){
      const code=pre+'-'+aleatorio(4);
      const {error}=await sb.from('access_codes').insert({code,company_id:S.co.id});
      if(!error){S.nuevo=code;flash(`Código ${code} listo. Una sola persona.`);return render()}
      if(!/duplicate/i.test(error.message))throw error;
    }
    throw new Error('No se ha podido generar un código único. Inténtalo otra vez.');
  },
  async copiar(b){
    try{await navigator.clipboard.writeText(b.dataset.v);flash('Copiado')}catch(e){flash(b.dataset.v)}
  },
  imprimir(){window.print()},
  async 'auto-turno'(b){
    const on=b.dataset.on==='1';
    b.classList.toggle('on',!on);b.setAttribute('aria-pressed',String(!on));
    const {error}=await sb.from('companies').update({auto_shift:!on}).eq('id',S.co.id);
    if(error){render();throw error}
    flash(on?'Turno automático desactivado. Marca tú cada día.':'Turno automático activado.');setTimeout(render,260)},
  async 'todos-hoy'(){
    const {error}=await sb.from('shifts').insert(S.sinTurno.map(id=>({stint_id:id})));
    if(error)throw error;flash('Todo el equipo marcado para hoy.');render()},
  async olvido(){
    const email=String(S.form.email||'').trim();
    if(!email)throw new Error('Escribe tu correo arriba y vuelve a pulsar.');
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:BASE});
    if(error)throw error;
    flash('Si existe una cuenta con ese correo, te hemos enviado un enlace.')},
  editar(){S.form.edit=true;render()},
  'editar-no'(){S.form.edit=false;render()},
  csv(){
    const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
    const txt='\ufeff'+[['Fecha','Persona','Estrellas','Comentario'],...S.csv].map(r=>r.map(q).join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
    a.download='valoraciones-'+hoy()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    flash('Valoraciones exportadas')},
  async canjear(b){
    const {data,error}=await sb.rpc('redeem_reward',{p_reward:b.dataset.id});if(error)throw error;
    flash(`Cupón ${data} creado. Enséñaselo al responsable.`);render()},
  async 'canjear-tippyo'(b){
    const {data,error}=await sb.rpc('redeem_platform',{p_reward:b.dataset.id});if(error)throw error;
    flash(`Descuento listo: ${data.code}`);render()},
  async entregar(b){
    const {error}=await sb.rpc('use_redemption',{p_code:b.dataset.code});if(error)throw error;
    flash('Cupón entregado.');render()},
  async 'premio-toggle'(b){
    const {error}=await sb.from('rewards').update({active:b.dataset.on!=='1'}).eq('id',b.dataset.id);if(error)throw error;render()},
  async 'premio-borrar'(b){
    const {error}=await sb.from('rewards').delete().eq('id',b.dataset.id);if(error)throw error;flash('Premio borrado.');render()},
  rotar(b){S.form.rotar=+b.dataset.n;render()},
  'rotar-no'(){S.form.rotar=null;render()},
  async 'rotar-ok'(b){
    const token=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
    const {error}=await sb.from('dining_tables').update({token}).eq('company_id',S.co.id).eq('table_no',+b.dataset.n);
    if(error)throw error;
    S.form.rotar=null;flash(`QR de la mesa ${b.dataset.n} renovado. Imprime el nuevo.`);render()},
  'imprimir-todas'(){
    const base=`${BASE}#/m/${S.co.id}/`,h=document.createElement('div');
    h.className='hoja';
    h.innerHTML=S.mesas.map(m=>`<div class="pegatina"><div class="n">${esc(S.co.name)}</div><div class="t">Escanea y valora a quien te atiende</div><canvas data-qr="${esc(base+m.table_no+'/'+m.token)}"></canvas><div class="m">MESA ${m.table_no}</div></div>`).join('');
    document.querySelector('.wrap').appendChild(h);dibujaQR();document.body.classList.add('todas');
    const fin=()=>{document.body.classList.remove('todas');h.remove();removeEventListener('afterprint',fin)};
    addEventListener('afterprint',fin);print();
  },
  async denunciar(b){
    const {error}=await sb.from('reports').insert({rating_id:b.dataset.id,reason:'comentario'});if(error)throw error;
    b.disabled=true;b.textContent='Denunciado';flash('Gracias. Lo revisaremos.')},
  'borrar-pedir'(){S.form.borrar=true;render()},
  'borrar-no'(){S.form.borrar=false;render()},
  async 'borrar-ok'(){
    try{const l=await sb.storage.from('photos').list(S.user.id);
      if(l.data&&l.data.length)await sb.storage.from('photos').remove(l.data.map(f=>S.user.id+'/'+f.name))}catch(e){console.warn(e)}
    const {error}=await sb.rpc('delete_my_account');if(error){S.form.borrar=false;throw error}
    try{await sb.auth.signOut()}catch(e){}
    S.user=null;S.co=null;S.form={};location.hash='#/';flash('Tu cuenta se ha borrado.');render()},
  async compartir(b){
    const on=b.getAttribute('aria-pressed')==='true';
    b.classList.toggle('on',!on);b.setAttribute('aria-pressed',String(!on));
    const {error}=await sb.from('profiles').update({share_history:!on}).eq('id',S.user.id);
    if(error){render();throw error}
    setTimeout(render,260);
  }
};

/* ---------- formularios ---------- */
const forms={
  async auth(f){
    const d=new FormData(f),rol=f.dataset.rol,alta=S.form.modo==='alta';
    const cred={email:String(d.get('email')).trim(),password:String(d.get('password'))};
    if(alta){
      const {data,error}=await sb.auth.signUp({...cred,options:{emailRedirectTo:BASE}});if(error)throw error;
      if(!data.session){flash('Te hemos enviado un correo. Ábrelo para confirmar y vuelve aquí.');return}
    }else{
      const {error}=await sb.auth.signInWithPassword(cred);if(error)throw error;
    }
    location.hash='#/'+rutaRol(rol);
  },
  async empresa(f){
    const d=new FormData(f),t=k=>String(d.get(k)||'').trim();
    const {error}=await sb.from('companies').insert({owner_id:S.user.id,name:t('nombre'),city:t('ciudad'),address:t('direccion')||null,description:t('descripcion')||null});
    if(error)throw error;
    S.form={};S.pintado=null;flash('Tu local ya está dado de alta.');render();
  },
  async mesas(f){
    const n=Math.min(60,Math.max(1,parseInt(new FormData(f).get('n'),10)||1));
    const rows=Array.from({length:n},(_,i)=>({company_id:S.co.id,table_no:i+1}));
    const {error}=await sb.from('dining_tables').upsert(rows,{onConflict:'company_id,table_no',ignoreDuplicates:true});
    if(error)throw error;render();
  },
  async perfil(f){
    const d=new FormData(f),file=d.get('foto');
    if(!file||!file.size)throw new Error('Elige una foto.');
    const {error}=await sb.from('profiles').insert({id:S.user.id,full_name:String(d.get('nombre')).trim(),job_title:String(d.get('puesto'))});
    if(error)throw error;
    try{await subirFoto(file)}catch(e){flash('Perfil creado, pero la foto ha fallado: '+errTxt(e),'err')}
    S.form={};S.pintado=null;render();
  },
  async premio(f){
    const d=new FormData(f);
    const {error}=await sb.from('rewards').insert({company_id:S.co.id,name:String(d.get('nombre')).trim(),cost:parseInt(d.get('coste'),10)});
    if(error)throw error;flash('Premio creado.');render()},
  async clave(f){
    const d=new FormData(f),p=String(d.get('p1'));
    if(p!==String(d.get('p2')))throw new Error('Las contraseñas no coinciden.');
    const {error}=await sb.auth.updateUser({password:p});if(error)throw error;
    S.recovery=false;location.hash='#/'+rutaRol(rolGuardado());flash('Contraseña actualizada.')},
  async 'perfil-ed'(f){
    const d=new FormData(f);
    const {error}=await sb.from('profiles').update({full_name:String(d.get('nombre')).trim(),job_title:String(d.get('puesto'))}).eq('id',S.user.id);
    if(error)throw error;S.form.edit=false;flash('Datos guardados.');render()},
  async 'local-ed'(f){
    const d=new FormData(f),t=k=>String(d.get(k)||'').trim();
    const {error}=await sb.from('companies').update({name:t('nombre'),city:t('ciudad'),address:t('direccion')||null}).eq('id',S.co.id);
    if(error)throw error;S.form.edit=false;flash('Datos guardados.');render()},
  async codigo(f){
    const pf=await sb.from('profiles').select('job_title').eq('id',S.user.id).maybeSingle();
    const {error}=await sb.rpc('redeem_code',{p_code:String(new FormData(f).get('codigo')).trim(),p_job:(pf.data&&pf.data.job_title)||null});
    if(error)throw error;
    S.pintado=null;flash('Ya estás en la plantilla. Tu jefe te marcará los días que trabajes.');render();
  }
};

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b||!acts[b.dataset.act])return;
  ev.preventDefault();S.dj=S.dt=null;
  try{await acts[b.dataset.act](b)}catch(e){console.error(e);flash(errTxt(e),'err')}
});
document.addEventListener('submit',async ev=>{
  const f=ev.target.closest('form[data-form]');
  if(!f||!forms[f.dataset.form])return;
  ev.preventDefault();S.dj=S.dt=null;
  const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{await forms[f.dataset.form](f)}catch(e){console.error(e);flash(errTxt(e),'err')}
  finally{if(btn&&btn.isConnected)btn.disabled=false}
});
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.keep;if(k)S.form[k]=ev.target.value});
document.addEventListener('change',async ev=>{
  const t=ev.target;S.dj=S.dt=null;
  if(t.dataset.change==='mesa'){S.form.mesa=t.value;render();return}
  if(t.dataset.cambiafoto&&t.files&&t.files[0]){
    try{await subirFoto(t.files[0]);flash('Foto subida. Tu jefe tiene que aprobarla.');render()}
    catch(e){console.error(e);flash(errTxt(e),'err')}
  }
});

/* ---------- arranque ---------- */
sb.auth.onAuthStateChange((ev,ses)=>{
  S.user=ses?ses.user:null;
  if(ev==='PASSWORD_RECOVERY'){S.recovery=true;setTimeout(()=>{location.hash='#/nueva-clave'},0);return}
  /* Llegada desde el enlace de confirmación del correo: te lleva a tu panel. */
  if(ev==='SIGNED_IN'&&!S.confirmado&&/access_token|type=(signup|magiclink|recovery)/.test(hashInicial)){
    S.confirmado=true;
    setTimeout(()=>{location.hash='#/'+rutaRol(rolGuardado())},0);
    return;
  }
  setTimeout(render,0); /* no llamar a Supabase dentro de este callback: provoca bloqueos */
});
window.addEventListener('hashchange',()=>{
  const e=ruta()[0]==='entrar';
  S.form=e?{modo:S.form.modo,email:S.form.email}:{};
  render();
});
(async()=>{const {data}=await sb.auth.getSession();S.user=data.session?data.session.user:null;render()})();
</script>
</body>
</html>
